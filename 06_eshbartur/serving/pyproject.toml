# Environment of the eshbartur engine: Python 3.12, Linux x86_64. `uv sync --frozen` installs exactly what uv.lock records.
[project]
name = "eshbartur-engine-env"
version = "1.0.0"
description = "Pinned environment for the eshbartur Decision Index text engine"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.14.1",
    "triton==3.8.0",
    "transformers==5.23.0",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    "huggingface_hub==1.33.0",
    "numpy==2.3.5",
    "flash-linear-attention==0.5.2",
    "fla-core==0.5.2",
    "einops==0.8.2",
    "httpx>=0.27",
    "sentencepiece",
    "protobuf",
    "decision-index",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
triton = { index = "pytorch-cu130" }
decision-index = { git = "https://github.com/apolinario/decision-index", rev = "9eb2dbe2a358004c8782c66e40a83ac07b953fec" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
